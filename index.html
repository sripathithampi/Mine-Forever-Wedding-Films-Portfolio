<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Photography Portfolio | Sripathi Thampi</title>
    <style>
        /* Removes all margins and scrollbars for a clean look */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #ffffff;
        }
        /* Forces the Canva container to fill the entire screen */
        .full-screen-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }
        /* Hides the small Canva text link at the bottom for a cleaner look */
        .footer-link {
            display: none;
        }
    </style>
</head>
<body>

    <div class="full-screen-container">
        <iframe loading="lazy" 
                src="https://www.canva.com/design/DAG80FqaHP4/EUz4T2g_mfffwJLpwnqqhg/view?embed" 
                allowfullscreen="allowfullscreen" 
                allow="fullscreen">
        </iframe>
    </div>

</body>
</html>
