<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; overflow: hidden; }
        
        /* This container forces the embed to behave like a landscape monitor */
        .landscape-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 56.25vw; /* This is the 16:9 Landscape ratio */
            max-height: 100vh;
            max-width: 177.78vh; /* Prevents it from getting too wide */
            margin: auto;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="landscape-wrapper">
        <iframe loading="lazy" 
                src="https://www.canva.com/design/DAG80FqaHP4/EUz4T2g_mfffwJLpwnqqhg/view?embed" 
                allowfullscreen="allowfullscreen" 
                allow="fullscreen">
        </iframe>
    </div>

</body>
</html>
