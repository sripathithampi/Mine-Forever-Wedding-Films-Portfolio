<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Photography Portfolio</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; }
        
        /* This wrapper creates a virtual large screen for Canva to prevent stacking */
        .desktop-emulation {
            position: absolute;
            top: 0;
            left: 0;
            width: 1440px; /* Forces Canva to see a desktop width */
            height: 900px;
            transform-origin: 0 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
    <script>
        function resize() {
            var width = window.innerWidth;
            var height = window.innerHeight;
            var scale = Math.min(width / 1440, height / 900);
            document.getElementById('wrapper').style.transform = 'scale(' + scale + ')';
        }
        window.onresize = resize;
        window.onload = resize;
    </script>
</head>
<body>
    <div id="wrapper" class="desktop-emulation">
        <iframe src="https://www.canva.com/design/DAG80FqaHP4/EUz4T2g_mfffwJLpwnqqhg/view?embed" allowfullscreen></iframe>
    </div>
</body>
</html>
