<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Photography Portfolio | Sripathi Thampi</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #111; overflow-y: auto; }
        
        /* This container forces the 16:9 landscape aspect ratio */
        .ratio-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio (9 / 16 = 0.5625) */
            height: 0;
            overflow: hidden;
        }

        .ratio-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="ratio-container">
        <iframe loading="lazy" 
                src="https://www.canva.com/design/DAG80FqaHP4/EUz4T2g_mfffwJLpwnqqhg/view?embed" 
                allowfullscreen="allowfullscreen" 
                allow="fullscreen">
        </iframe>
    </div>

</body>
</html>
