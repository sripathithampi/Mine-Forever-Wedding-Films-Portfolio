<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Wedding Photography Portfolio | Sripathi Thampi</title>
    <style>
        /* Removes all margins and prevents the 'long page' scrolling issue */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #000; 
        }
        
        /* Forces the iframe to be 100% of the viewport without stacking */
        #canva-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="canva-frame" 
            src="https://www.canva.com/design/DAG80FqaHP4/EUz4T2g_mfffwJLpwnqqhg/view?embed" 
            allowfullscreen>
    </iframe>
</body>
</html>
